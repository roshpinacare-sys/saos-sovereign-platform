[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.36"
optimizer = true
optimizer_runs = 200
verbosity = 3

[profile.ci]
verbosity = 4

[fuzz]
runs = 256

